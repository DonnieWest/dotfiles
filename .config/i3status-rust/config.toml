[theme]
theme = "solarized-dark"
[theme.overrides]
idle_bg = "#03090e"
info_bg = "#03090e"
good_bg = "#03090e"
warning_bg = "#03090e"
critical_bg = "#ff5555"
separator_bg = "#03090e"
idle_fg = "#e6f9f7"
info_fg = "#e6f9f7"
good_fg = "#e6f9f7"
warning_fg = "#ffb86c"
critical_fg = "#03090e"

[icons]
icons = "awesome5"
[icons.overrides]
music = ""

[[block]]
block = "custom"
command = "sed 's/64110://' <(curl 'https://wttr.in/64110?u&format=3' -s)"
interval = 600

[[block]]
block = "music"
format = " $icon {$combo.str(max_w:50,rot_interval:0.5) |}"

[[block]]
block = "custom"
command = "~/.bin/bluetooth-battery"
interval = 60

[[block]]
block = "net"
device = "wlan0"
format = "$ssid $ip|disconnected"

[[block]]
block = "custom"
command = "/home/igneo676/.config/i3status-rust/check-vpn"
interval = 5

[[block]]
block = "github"
format = "$icon $total | $icon $mention | $icon $review_requested"
info = ["total"]
hide_if_total_is_zero = true
warning = ["mention","review_requested"]

[[block]]
block = "memory"
format = "$mem_used / $mem_total"
format_alt ="$swap_used / $swap_total"

[[block]]
block = "sound"
driver = "auto"

[[block]]
block = "battery"

[[block]]
block = "time"
interval = 10
format = "$timestamp.datetime(f:'%m-%d-%Y %l:%M %p ')"
