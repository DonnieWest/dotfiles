# Sway-inspired Aerospace setup for macOS.

config-version = 2
start-at-login = true
after-startup-command = [
  'exec-and-forget sketchybar',
]

exec-on-workspace-change = [
  '/bin/sh',
  '-c',
  '$HOME/.config/aerospace/workspace-change.sh',
]

enable-normalization-flatten-containers = false
focus-follows-mouse.enabled = true
enable-normalization-opposite-orientation-for-nested-containers = false
accordion-padding = 30
persistent-workspaces = []

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
# Terminal and launcher
cmd-enter = 'exec-and-forget open -na Ghostty'

# Window lifecycle
cmd-q = 'close'

# Focus windows
cmd-left = 'focus left'
cmd-down = 'focus down'
cmd-up = 'focus up'
cmd-right = 'focus right'
cmd-j = 'focus left'
cmd-k = 'focus down'
cmd-l = 'focus up'
cmd-semicolon = 'focus right'

# Move windows within the tree
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'
cmd-shift-left = 'move left'
cmd-shift-down = 'move down'
cmd-shift-up = 'move up'
cmd-shift-right = 'move right'

# Resize windows
cmd-ctrl-h = 'resize width -50'
cmd-ctrl-j = 'resize height +50'
cmd-ctrl-k = 'resize height -50'
cmd-ctrl-l = 'resize width +50'
cmd-ctrl-left = 'resize width -50'
cmd-ctrl-down = 'resize height +50'
cmd-ctrl-up = 'resize height -50'
cmd-ctrl-right = 'resize width +50'

# Layout toggles
cmd-alt-f = 'fullscreen'
cmd-shift-space = 'layout floating tiling'
cmd-space = 'layout floating tiling'
cmd-h = 'split horizontal'
cmd-e = 'layout tiles horizontal vertical'
cmd-s = 'layout accordion horizontal vertical'
cmd-t = 'layout accordion horizontal vertical'
cmd-r = 'mode resize'
cmd-z = 'workspace-back-and-forth'

# Focus workspaces
cmd-1 = 'workspace --auto-back-and-forth 01'
cmd-2 = 'workspace --auto-back-and-forth 02'
cmd-3 = 'workspace --auto-back-and-forth 03'
cmd-4 = 'workspace --auto-back-and-forth 04'
cmd-5 = 'workspace --auto-back-and-forth 05'
cmd-6 = 'workspace --auto-back-and-forth 06'
cmd-7 = 'workspace --auto-back-and-forth 07'
cmd-8 = 'workspace --auto-back-and-forth 08'
cmd-9 = 'workspace --auto-back-and-forth 09'
cmd-0 = 'workspace --auto-back-and-forth 10'

# Move windows to workspaces and follow
cmd-shift-1 = ['move-node-to-workspace 01', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-2 = ['move-node-to-workspace 02', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-3 = ['move-node-to-workspace 03', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-4 = ['move-node-to-workspace 04', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-5 = ['move-node-to-workspace 05', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-6 = ['move-node-to-workspace 06', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-7 = ['move-node-to-workspace 07', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-8 = ['move-node-to-workspace 08', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-9 = ['move-node-to-workspace 09', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']
cmd-shift-0 = ['move-node-to-workspace 10', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

# Next / previous workspace
alt-ctrl-right = 'workspace --wrap-around next'
alt-ctrl-left = 'workspace --wrap-around prev'
alt-ctrl-semicolon = 'workspace --wrap-around next'
alt-ctrl-j = 'workspace --wrap-around prev'

# Move focused window to the previous workspace, matching Sway's back-and-forth move.
cmd-shift-z = 'exec-and-forget $HOME/.config/aerospace/move-node-to-previous-workspace.sh'

# Apps
cmd-w = 'exec-and-forget open -na "Firefox"'
cmd-f = 'exec-and-forget open -na Ghostty --args -e yazi "$HOME"'

# Aerospace does not support binding the raw Print key. Use a native selector
# on a supported chord instead.
cmd-shift-s = 'exec-and-forget screencapture -i -c'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
cmd-r = 'mode main'

# App placement rules. App IDs may need small tweaks after checking
# `aerospace list-windows --all` on the target Mac.
[[on-window-detected]]
if.app-id = 'org.qutebrowser.qutebrowser'
run = ['layout tiling', 'move-node-to-workspace 01', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefoxdeveloperedition'
run = ['move-node-to-workspace 01', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace 01', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 02', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = ['move-node-to-workspace 02', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'com.google.android.studio'
run = ['move-node-to-workspace 05', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 09', 'exec-and-forget $HOME/.config/aerospace/trigger-sketchybar-workspaces.sh']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systemsettings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'
